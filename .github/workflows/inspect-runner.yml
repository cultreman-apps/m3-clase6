name: Laboratorio 0 - entrar al runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: Abrir acceso SSH temporal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Abrir la sesión con tmate
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        with:
          limit-access-to-actor: true
